version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: procurement-db
    environment:
      POSTGRES_DB: procurement
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/main/resources/db/migration:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d procurement"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: procurement-redis
    ports:
      - "6379:6379"

  app:
    build: .
    container_name: procurement-app
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/procurement
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: secret
      LLM_API_KEY: ${LLM_API_KEY}
    restart: unless-stopped

volumes:
  postgres_data: